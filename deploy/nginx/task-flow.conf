# Task Flow Web 서버(Nginx) 설정
# 화면 파일은 /var/www/task-flow에서 제공하고 /api/ 요청은 App 서버로 전달한다.
# 설치: sudo cp deploy/nginx/task-flow.conf /etc/nginx/sites-available/task-flow
#       sudo ln -s /etc/nginx/sites-available/task-flow /etc/nginx/sites-enabled/task-flow
# App 서버를 다른 장비로 분리하면 proxy_pass 주소를 그 서버의 사설 IP로 바꾼다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/task-flow;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 설명 2000자 등 JSON 본문만 받으므로 요청 크기를 작게 제한한다.
    client_max_body_size 64k;
}
